<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./assets/images/harvey logo.svg">
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private owner login for analytics and blog management.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEFF2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1117">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css?v=20261008-min">
  <script src="./java/analytics-config.js" defer></script>
  <script src="./java/local-gate.js?v=20260815-4" defer></script>
</head>
<body class="analytics-page">
  <section class="analytics-gate" id="localGate" aria-label="Dashboard login">
    <div class="analytics-gate-card">
      <h1>Login</h1>

      <label class="analytics-gate-label" for="localGateUsername">Username</label>
      <input class="analytics-gate-input" id="localGateUsername" type="text" autocomplete="username" placeholder="Enter username">

      <label class="analytics-gate-label" for="localGatePassword">Password</label>
      <input class="analytics-gate-input" id="localGatePassword" type="password" autocomplete="current-password" placeholder="Enter password">

      <div class="analytics-actions">
        <button class="btn btn-primary" id="localGateSubmit" type="button">Log In</button>
        <a class="btn btn-ghost" href="./home">Back to Portfolio</a>
      </div>
    </div>
  </section>
</body>
</html>
